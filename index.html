<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM PRO AGNT · XAUUSD · CONEXIÓN REAL TWELVE DATA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080A0E;--bg2:#0D1018;--bg3:#111520;
  --gold:#C9A027;--gold2:#F0C040;
  --cyan:#00E5FF;--green:#00E676;--red:#FF3D3D;
  --purple:#B44FFF;--blue:#4488FF;
  --dim:#2A3045;--muted:#5A6070;--text:#E8E6DE;
  --border:rgba(201,160,39,0.18);--bcyan:rgba(0,229,255,0.2);
}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:999}

.wrap{padding:14px;max-width:1600px;margin:0 auto}

/* HEADER */
.header{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;margin-bottom:10px;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.h-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-size:12px;color:var(--gold);letter-spacing:3px;font-family:'Rajdhani',sans-serif;font-weight:700}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 6px var(--green)}50%{opacity:.2;box-shadow:none}}
.api-badge{font-size:9px;padding:3px 10px;border-radius:3px;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.25);color:var(--cyan);letter-spacing:2px;font-family:'Rajdhani',sans-serif;font-weight:600}
.pair-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.price-big{font-size:38px;font-weight:700;color:var(--gold2);font-family:'Rajdhani',sans-serif;letter-spacing:1px;text-shadow:0 0 24px rgba(240,192,64,0.3)}
.chg{font-size:14px;padding:4px 12px;border-radius:4px;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:1px}
.chg.pos{background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.2)}
.chg.neg{background:rgba(255,61,61,0.12);color:var(--red);border:1px solid rgba(255,61,61,0.2)}
.sub{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:1px}

/* CONTROLS */
.controls-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tf-row{display:flex;gap:6px}
.tf{font-size:11px;padding:7px 16px;border-radius:5px;border:1px solid var(--dim);background:transparent;color:var(--muted);cursor:pointer;letter-spacing:2px;font-family:'Rajdhani',sans-serif;font-weight:600;transition:all .15s}
.tf:hover{border-color:var(--gold);color:var(--gold)}
.tf.on{background:var(--gold);color:#000;border-color:var(--gold);box-shadow:0 0 8px rgba(201,160,39,0.3)}
.key-box{display:flex;align-items:center;gap:6px;margin-left:auto}
.key-input{background:#0A0C12;border:1px solid var(--dim);border-radius:4px;padding:5px 8px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--gold);width:160px;outline:none}
.key-btn{font-size:9px;padding:5px 10px;border-radius:4px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700}

/* CHART */
.chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;position:relative}
.chart-top{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid rgba(255,255,255,0.04)}
.ct-label{font-size:10px;color:var(--gold);letter-spacing:2px;font-family:'Rajdhani',sans-serif;font-weight:600}
.ct-info{font-size:9px;color:var(--muted)}
canvas#cvs{display:block;width:100%;height:380px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.stat-lbl{font-size:8px;color:var(--muted);letter-spacing:2px;margin-bottom:4px;font-family:'Rajdhani',sans-serif;font-weight:600}
.stat-val{font-size:18px;font-weight:700;font-family:'Rajdhani',sans-serif}

/* ERROR BANNER */
.err-box{background:rgba(255,61,61,0.1);border:1px solid rgba(255,61,61,0.3);color:var(--red);padding:8px 12px;border-radius:6px;font-size:11px;margin-bottom:10px;display:none;font-family:'Share Tech Mono',monospace}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="h-top">
      <div class="brand"><span class="live-dot"></span>AURUM PRO AGNT · XAUUSD · CONEXIÓN DIRECTA</div>
      <span class="api-badge" id="apiBadge">INICIALIZANDO</span>
    </div>
    <div class="pair-row">
      <span style="font-size:13px;color:var(--gold);font-weight:700;letter-spacing:2px;font-family:'Rajdhani',sans-serif">XAU/USD</span>
      <span class="price-big" id="livePrice">---</span>
      <span class="chg pos" id="priceChg">...</span>
    </div>
    <div class="sub" id="sessionLbl">Esperando respuesta de API...</div>
  </div>

  <div class="err-box" id="errBox"></div>

  <!-- CONTROLES Y API KEY -->
  <div class="controls-row">
    <div class="tf-row">
      <button class="tf" onclick="setTF(this,'5min')">5M</button>
      <button class="tf on" onclick="setTF(this,'15min')">15M</button>
      <button class="tf" onclick="setTF(this,'1h')">1H</button>
      <button class="tf" onclick="setTF(this,'4h')">4H</button>
      <button class="tf" onclick="setTF(this,'1day')">D</button>
    </div>
    <div class="key-box">
      <input type="text" class="key-input" id="apiKeyInput" placeholder="Tu API Key Twelve Data">
      <button class="key-btn" onclick="updateApiKey()">GUARDAR KEY</button>
    </div>
  </div>

  <!-- CHART -->
  <div class="chart-wrap">
    <div class="chart-top">
      <span class="ct-label" id="ctLabel">XAU/USD · 15M</span>
      <span class="ct-info" id="ctInfo">Cargando gráfico...</span>
    </div>
    <canvas id="cvs"></canvas>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-lbl">PRECIO REAL</div><div class="stat-val" id="s1" style="color:var(--gold2)">---</div></div>
    <div class="stat-card"><div class="stat-lbl">ATR (14)</div><div class="stat-val" id="s2" style="color:var(--cyan)">---</div></div>
    <div class="stat-card"><div class="stat-lbl">ZONA P/D</div><div class="stat-val" id="s3" style="font-size:15px">---</div></div>
    <div class="stat-card"><div class="stat-lbl">SESIÓN ACTIVA</div><div class="stat-val" id="s4" style="font-size:14px">---</div></div>
  </div>
</div>

<script>
// Clave por defecto (se puede sustituir por la tuya si expira)
var TD_KEY = localStorage.getItem('aurum_td_key') || '55c198220c554394bc4d9475bef8f616';
var candles = [], levels = {}, currentPrice = 0, openPrice = 0;
var activeTF = '15min';

window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('apiKeyInput').value = TD_KEY;
  loadRealData(activeTF);
  // Actualizar cada 30 segundos para no agotar el límite de 8 peticiones/min de la versión Free
  setInterval(function(){ loadRealData(activeTF); }, 30000);
});

function updateApiKey(){
  var k = document.getElementById('apiKeyInput').value.trim();
  if(k){
    TD_KEY = k;
    localStorage.setItem('aurum_td_key', k);
    loadRealData(activeTF);
  }
}

function fmt(n){ return parseFloat(n).toFixed(2); }

function showErr(msg){
  var eb = document.getElementById('errBox');
  if(msg){
    eb.style.display = 'block';
    eb.textContent = '⚠️ API Error: ' + msg;
  } else {
    eb.style.display = 'none';
  }
}

function loadRealData(interval){
  var badge = document.getElementById('apiBadge');
  badge.textContent = 'CONECTANDO...';
  badge.style.color = '#FF9100';
  showErr(null);

  // Solicitamos 50 velas. Un solo endpoint para ahorrar peticiones.
  var url = 'https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=' + interval + '&outputsize=50&apikey=' + TD_KEY;

  fetch(url)
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data){
      // Si Twelve Data devuelve un error en el cuerpo JSON
      if(data.status === 'error' || data.code){
        throw new Error(data.message || 'Error de autenticación o límite alcanzado');
      }

      if(!data.values || !data.values.length){
        throw new Error('No se recibieron velas para XAU/USD');
      }

      // Procesar datos reales de Twelve Data (vienen ordenados del más reciente al más antiguo)
      candles = data.values.slice().reverse().map(function(v){
        return {
          o: parseFloat(v.open),
          h: parseFloat(v.high),
          l: parseFloat(v.low),
          c: parseFloat(v.close),
          t: v.datetime
        };
      });

      currentPrice = candles[candles.length - 1].c;
      openPrice = candles[0].o;

      badge.textContent = 'TWELVE DATA (REAL)';
      badge.style.color = 'var(--green)';

      finishProcess(interval);
    })
    .catch(function(err){
      console.warn('Fallo al conectar con Twelve Data:', err.message);
      showErr(err.message + '. Mostrando datos de respaldo.');
      
      badge.textContent = 'FALLO API - MODALIDAD MOCK';
      badge.style.color = 'var(--red)';

      // Carga datos sintéticos de respaldo si la API falla por límite de peticiones o clave inválida
      if(!candles.length){
        currentPrice = 2742.50;
        openPrice = 2735.10;
        candles = generateFallbackCandles(currentPrice, 50);
      }
      finishProcess(interval);
    });
}

function finishProcess(interval){
  levels = computeLevels(candles);
  var pct = ((currentPrice - openPrice) / openPrice) * 100;
  
  document.getElementById('livePrice').textContent = '$' + fmt(currentPrice);
  var ce = document.getElementById('priceChg');
  ce.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
  ce.className = 'chg ' + (pct >= 0 ? 'pos' : 'neg');
  document.getElementById('ctLabel').textContent = 'XAU/USD · ' + interval.toUpperCase() + ' · DATA REAL';

  drawChart();
  updateUI();
}

function setTF(el, t){
  activeTF = t;
  document.querySelectorAll('.tf').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
  loadRealData(t);
}

function computeLevels(cd){
  var n = cd.length;
  var cl = cd.map(function(d){ return d.c; });
  var hi = cd.map(function(d){ return d.h; });
  var lo = cd.map(function(d){ return d.l; });

  var atr = hi[1] - lo[1];
  for(var i=2; i<Math.min(15,n); i++){
    var tr = Math.max(hi[i]-lo[i], Math.abs(hi[i]-cl[i-1]), Math.abs(lo[i]-cl[i-1]));
    atr = (atr*13 + tr)/14;
  }

  var sh = Math.max.apply(null, hi.slice(-20));
  var sl = Math.min.apply(null, lo.slice(-20));
  var eq = (sh + sl) / 2;

  return {
    sh: sh, sl: sl, eq: eq, atr: atr,
    zone: currentPrice > eq ? 'PREMIUM' : 'DISCOUNT'
  };
}

function drawChart(){
  var cv = document.getElementById('cvs');
  var ctx = cv.getContext('2d');
  var W = cv.width = cv.clientWidth;
  var H = cv.height = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  if(!candles.length) return;

  var minP = Math.min.apply(null, candles.map(function(c){ return c.l; }));
  var maxP = Math.max.apply(null, candles.map(function(c){ return c.h; }));
  var pad = (maxP - minP) * 0.05 || 1;
  minP -= pad; maxP += pad;

  function getY(p){ return H - ((p - minP) / (maxP - minP)) * H; }
  var cW = W / candles.length;

  // Línea Equilibrium
  if(levels.eq){
    var eqY = getY(levels.eq);
    ctx.strokeStyle = 'rgba(201,160,39,0.5)';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(0,eqY); ctx.lineTo(W,eqY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Velas
  candles.forEach(function(c, i){
    var x = i * cW + cW / 2;
    var oY = getY(c.o), cY = getY(c.c);
    var hY = getY(c.h), lY = getY(c.l);
    var up = c.c >= c.o;
    var color = up ? '#00E676' : '#FF3D3D';

    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(x, hY); ctx.lineTo(x, lY); ctx.stroke();

    ctx.fillStyle = color;
    var bw = Math.max(2, cW * 0.65);
    ctx.fillRect(x - bw/2, Math.min(oY, cY), bw, Math.abs(cY - oY) || 1);
  });
}

function updateUI(){
  document.getElementById('s1').textContent = '$' + fmt(currentPrice);
  document.getElementById('s2').textContent = fmt(levels.atr || 0);
  document.getElementById('s3').textContent = levels.zone || '---';
  document.getElementById('s3').style.color = levels.zone === 'DISCOUNT' ? 'var(--green)' : 'var(--red)';
  document.getElementById('s4').textContent = 'ACTIVA';
  document.getElementById('s4').style.color = 'var(--cyan)';
  document.getElementById('sessionLbl').textContent = 'Conectado a servidor de Twelve Data en tiempo real';
}

function generateFallbackCandles(base, n){
  var out = [], p = base;
  for(var i=n; i>=0; i--){
    var chg = (Math.random()-0.49)*3;
    var o = p, c = p + chg;
    var h = Math.max(o,c) + Math.random()*1.5;
    var l = Math.min(o,c) - Math.random()*1.5;
    out.push({o:o, h:h, l:l, c:c, t:''});
    p = c;
  }
  return out;
}
</script>
</body>
</html>
